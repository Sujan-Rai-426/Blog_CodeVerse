    <!-- Scripts to verify my website in google adsesnse -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6317483086789968"
     crossorigin="anonymous"></script> -->

    <title>CodeVerse</title>

    <!-- ✅ Auto-add 💻 emoji dynamically if missing -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const brand = "CodeVerse";
        const emoji = "💻";
        if (!document.title.includes(emoji)) {
          document.title = `${brand}${emoji}`;
        }

        // Also adjust OG and Twitter tags dynamically
        const ogTitle = document.querySelector('meta[property="og:title"]');
        const twitterTitle = document.querySelector('meta[name="twitter:title"]');

        if (ogTitle && !ogTitle.content.includes(emoji)) {
          ogTitle.content = `${brand}${emoji} - Frontend designs and Backend Guide with complete code.`;
        }

        if (twitterTitle && !twitterTitle.content.includes(emoji)) {
          twitterTitle.content = `${brand}${emoji} - Frontend & Backend with Complete Source Codes`;
        }
      });
    </script>
